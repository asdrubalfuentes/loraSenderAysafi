; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ttgo-lora32-v2]
platform = espressif32
board = ttgo-lora32-v2
framework = arduino
lib_deps = 
	esphome/ESPAsyncWebServer-esphome @ ^3.2.2
	esphome/AsyncTCP-esphome @ ^2.1.3
	bakercp/CRC32 @ ^2.0.0
	hideakitai/MQTTPubSubClient @ ^0.3.2
; WIFI_SSID/WIFI_PASSWORD NUNCA se hardcodean en el repo.
; Localmente: exporta las variables de entorno antes de compilar
;   (PowerShell)  $env:WIFI_SSID="AYSAFI"; $env:WIFI_PASSWORD="..."
; En CI: se inyectan desde GitHub Actions secrets (ver .github/workflows/release.yml).
; FW_VERSION_OVERRIDE se define automaticamente por el workflow a partir del tag vX.Y.Z.
build_flags =
	-D WIFI_SSID=\"${sysenv.WIFI_SSID}\"
	-D WIFI_PASSWORD=\"${sysenv.WIFI_PASSWORD}\"
	${sysenv.EXTRA_BUILD_FLAGS}

